# Recogs — XcodeGen project spec. Regenerate with `make generate`.
# One multiplatform SwiftUI app target over the local DiscogsKit package.

name: Recogs

options:
  bundleIdPrefix: com.mlkshkvch.recogs
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  DiscogsKit:
    path: DiscogsKit

targets:
  # Everything but the @main entry point: SwiftData cache, services, and the SwiftUI feature layer.
  # Keeping the views here too means only AppServices and the root view need to be public, and the
  # tests can run unhosted — no app launch, no sandbox, no signing.
  RecogsKit:
    type: framework
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/Kit
    dependencies:
      - package: DiscogsKit
        product: DiscogsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.recogs.kit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  Recogs:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - Sources/App
    dependencies:
      - target: RecogsKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Recogs
        CFBundleName: Recogs
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 Emil Kashkevich · MIT License"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    entitlements:
      path: Config/Recogs.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Discogs API and the image CDN.
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.recogs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Not app-hosted: the runner is unsandboxed and needs no signing, which matters for the
  # Keychain-backed token store.
  RecogsTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - Tests
    dependencies:
      - target: RecogsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlkshkvch.recogs.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Recogs:
    build:
      targets:
        RecogsKit: all
        Recogs: [run, profile, archive, analyze]
        RecogsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecogsTests
    archive:
      config: Release
